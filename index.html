<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spam Detector</title>

<style>
body{
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
    max-width:600px;
    margin:50px auto;
    padding:20px;
}

textarea{
    width:100%;
    height:150px;
    padding:12px;
    background:#111;
    border:1px solid #444;
    color:#fff;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    margin-top:10px;
    padding:10px 20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

#result{
    margin-top:15px;
    padding:12px;
    background:#111;
    border-radius:8px;
}
</style>
</head>

<body>

<h2>Spam Detector</h2>
<textarea id="message" placeholder="Enter message"></textarea>
<button onclick="predict()">Check</button>

<div id="result">...</div>

<script>
async function predict() {

    const result = document.getElementById("result");
    const message = document.getElementById("message").value.trim();

    if (!message) {
        result.className = "result info";
        result.innerText =
            "Enter a message ...";
        return;
    }
    try {

        const response = await fetch(
            "https://spam-message-detector-j7k0.onrender.com/
            
            
            
            
            
            ",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: message
                })
            }
        );

        const data = await response.json();
        const 
        
        
        
        
        
        ion =
            String(data.prediction).toLowerCase();

        if (
            prediction === "spam") {

            result.className = "result spam";
            result.innerText =
                " Spam Detected";

        } else {

            result.className = "result safe";
            result.innerText =
                " Safe Message";
        }

    } catch (error) {

        result.className = "result info";
        result.innerText =
            "Server Connection Error";

        console.error(error);
    }
}
</script>
</body>
</html>
